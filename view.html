<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduArt Interactive</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #app-container, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const lang = urlParams.get('lang') || 'ar';
      const key = urlParams.get('key');
      
      const SECRET_KEY = "edu2026";
      // استبدلي هذا الرابط برابط صفحة الكمين الخاصة بكِ
      const TRAP_PAGE_URL = "https://edu-art-3d-book.my.canva.site/land-animals-trap"; 

      // 1. التحقق من مفتاح الحماية
      if (key !== SECRET_KEY) {
        window.location.href = TRAP_PAGE_URL;
        return;
      }

      // 2. تنظيف شريط العنوان فوراً ومسح المفتاح السري!
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${id}&lang=${lang}`;
      window.history.replaceState({path: cleanUrl}, '', cleanUrl);

      // 3. خريطة الروابط (استبدلي your-username باسم حسابك الحقيقي)
      const modelsBaseUrls = {
        "elephant": "https://edu-art-3d.github.io/Eduart-elephant-3D/",
"giraffe": "https://edu-art-3d.github.io/Eduart-giraffe-3D/",
"lion": "https://edu-art-3d.github.io/Eduart-lion-3D/",
"Tiger": "https://edu-art-3d.github.io/Eduart-Tiger-3D/",
"Velociraptor": "https://edu-art-3d.github.io/Eduart-Velociraptor-3D/",
"horse": "https://edu-art-3d.github.io/Eduart-horse-3D/",
"rabbit": "https://edu-art-3d.github.io/Eduart-rabbit-3D/",
"deer": "https://edu-art-3d.github.io/Eduart-deer-3D/",
"sheep": "https://edu-art-3d.github.io/Eduart-sheep-3D/",
"triceratops": "https://edu-art-3d.github.io/Eduart-triceratops-3D/",
"cat": "https://edu-art-3d.github.io/Eduart-cat-3D/",
"cow": "https://edu-art-3d.github.io/Eduart-cow-3D/",
"panda": "https://edu-art-3d.github.io/Eduart-panda-3D/",
"bear": "https://edu-art-3d.github.io/Eduart-bear-3D/",
"Trex": "https://edu-art-3d.github.io/Eduart-Trex-3D/",
"dog": "https://edu-art-3d.github.io/Eduart-dog-3D/",
"Squirrel": "https://edu-art-3d.github.io/Eduart-Squirrel-3D/",
"zebra": "https://edu-art-3d.github.io/Eduart-zebra-3D/",
"fox": "https://edu-art-3d.github.io/Eduart-fox-3D/",
"Brachiosauru": "https://edu-art-3d.github.io/Eduart-Brachiosauru-3D/"
      };

      const selectedModel = modelsBaseUrls[id];

      if (selectedModel) {
        // فتح نموذج الفيل داخل iframe وتمرير المفتاح له
        const targetUrl = selectedModel + "?key=" + SECRET_KEY;
        document.getElementById('app-container').innerHTML = `<iframe src="${targetUrl}" allow="camera; microphone; ar"></iframe>`;
      } else {
        window.location.href = TRAP_PAGE_URL;
      }
    })();
  </script>

</body>
</html>
